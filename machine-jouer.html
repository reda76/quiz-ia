<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#6d5ae6" />
  <title>Battez la machine</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/machine.css" />
  <link rel="stylesheet" href="css/jeux2.css" />
</head>
<body>
  <main class="tel">
    <div class="entete"><span id="qui"></span><span id="ou"></span></div>

    <section id="v-rejoindre" class="carte cache">
      <h1>Battez la machine</h1>
      <p>Entre ton prénom : ta droite s'affichera avec lui sur le grand écran.</p>
      <form id="form">
        <input class="champ" id="code" inputmode="numeric" autocomplete="off" placeholder="Code de la partie" maxlength="6" />
        <input class="champ" id="prenom" autocomplete="given-name" placeholder="Ton prénom" maxlength="20" />
        <button class="gros" id="entrer" type="submit">C'est parti</button>
      </form>
      <div class="erreur" id="erreur"></div>
    </section>

    <section id="v-message" class="centre cache">
      <div class="grand" id="m-grand"></div>
      <div class="moyen" id="m-moyen"></div>
    </section>

    <section id="v-jeu" class="reglages cache">
      <div class="score-tel"><div class="ecart" id="j-ecart"></div><div class="rang" id="j-rang"></div></div>
      <svg id="mini" class="mini"></svg>
      <div class="curseur">
        <div class="tete"><span>b · ventes à 0 °C <span class="sens">(fait monter la droite)</span></span><span class="valeur" id="v-b"></span></div>
        <input type="range" id="r-b" />
        <div class="pas"><button data-c="b" data-s="-1">−</button><button data-c="b" data-s="1">+</button></div>
      </div>
      <div class="curseur">
        <div class="tete"><span>w · litres en plus par degré <span class="sens">(rend la droite plus raide)</span></span><span class="valeur" id="v-w"></span></div>
        <input type="range" id="r-w" />
        <div class="pas"><button data-c="w" data-s="-1">−</button><button data-c="w" data-s="1">+</button></div>
      </div>
      <button class="gros valider" id="valider" type="button">✓ Je valide ma droite</button>
    </section>
  </main>
  <script type="module" src="js/machine-jouer.mjs"></script>
</body>
</html>
